<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mugznlugz — Portal</title>
  <meta name="description" content="Mugznlugz — sleek black luxury portal." />
  <link rel="icon" href="./assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ============================= -->
    <!--           SIDEBAR             -->
    <!-- ============================= -->
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <a href="#home" class="logo-link" id="logoLink" data-panel="home" aria-label="Return to Home">
          <img
            src="./assets/mugznlugz.png"
            alt="Mugznlugz"
            class="logo-img"
            id="logoImg"
            onerror="this.onerror=null; this.style.display='none'; document.getElementById('logoFallback').style.display='inline-flex';"
          />
          <span class="logo-fallback" id="logoFallback">Mugznlugz</span>
        </a>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-btn active" data-panel="home" type="button">
          <span class="nav-dot"></span><span>Home</span>
        </button>
        <button class="nav-btn" data-panel="trims" type="button">
          <span class="nav-dot"></span><span>Over 250,000 Trims to Choose From</span>
        </button>
        <button class="nav-btn" data-panel="garage" type="button">
          <span class="nav-dot"></span><span>Store and Maintain Cars in Your Garage</span>
        </button>
        <button class="nav-btn" data-panel="marketplace" type="button">
          <span class="nav-dot"></span><span>Buy and Sell Your Cars and Parts</span>
        </button>
      </nav>
    </aside>

    <!-- ============================= -->
    <!--         MAIN CONTENT          -->
    <!-- ============================= -->
    <main class="main">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" type="button">
        <span></span><span></span><span></span>
      </button>

      <!-- HOME -->
      <section class="panel active" id="panel-home">
        <div class="welcome-card">
          <img src="./assets/mnl.png" alt="Mugznlugz" class="home-image" />
        </div>
      </section>

      <!-- TRIMS -->
      <section class="panel screenshot-panel" id="panel-trims">
        <img src="./assets/Screenshot%202026-04-22%20091301.png" alt="Over 250,000 Trims to Choose From" class="screenshot-img" />
      </section>

      <!-- GARAGE -->
      <section class="panel screenshot-panel" id="panel-garage">
        <img src="./assets/Screenshot%202026-04-22%20091347.png" alt="Store and Maintain Cars in Your Garage" class="screenshot-img" />
      </section>

      <!-- MARKETPLACE -->
      <section class="panel screenshot-panel" id="panel-marketplace">
        <img src="./assets/Screenshot%202026-04-22%20091424.png" alt="Buy and Sell Your Cars and Parts" class="screenshot-img" />
      </section>

    </main>
  </div>

  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
